!Switch
[T_n, Tnuc_n, Tnuc_d]: !ConstantMap
  map:
     T_n:        -20e6
     Tnuc_n: 0
     Tnuc_d: 0

[Tnuc_s, T_s, T_d]: !EvalModel
    parameters: [x, y, z, fault_tag]
    model: !Switch
        [x, y, z]: !AffineMap
          matrix:
            x: [1.0, 0.0, 0.0]
            y: [0.0, 1.0, 0.0]
            z: [0.0, 0.0, 1.0]
          translation:
            x: 0.0
            y: 0.0
            z: 0.0
        [fault_tag]: !Any
             components:
             - !GroupFilter
                groups: 3
                # KefaloniaTransformFault
                components: !ConstantMap
                  map:
                    fault_tag: 3
             - !GroupFilter
                groups: 65
                # SouthernThrust
                components: !ConstantMap
                  map:
                    fault_tag: 65
             - !GroupFilter
                groups: 66
                # NorthernThurst
                components: !ConstantMap
                  map:
                    fault_tag: 66
    components: !LuaMap
      returns: [Tnuc_s, T_s, T_d]
      function: |
        function f (x)
          baseline_shear_stress = 8e6

          -- Shear stress depth profile parameters
          z0 = 15000.0        -- Seismogenic transition depth (m)
          H = 3000.0          -- Decay length scale (m)
          
          z_abs = math.abs(x["z"])
          shear_stress = baseline_shear_stress

          -- Apply exponential decay below seismogenic depth
          if (z_abs > z0) then
            shear_stress = baseline_shear_stress * math.exp(-(z_abs - z0) / H)
          end

          if (x.fault_tag == 3) then
             T_s = shear_stress
             T_d = 0
          else
             T_d = shear_stress
             T_s = 0
          end

          -- Nucleation parameters
          -- xha = { -11800.0, 40340.0, -11900.0}
          xha = { -18230,20e3,-8300.0}
        
          r_c = 3000.0
          r = math.sqrt((x["x"]-xha[1])^2 + (x["y"]-xha[2])^2 + (x["z"]-xha[3])^2 )
          
          if (r < r_c) then
            ratio = (r / r_c)^4
            Tnuc_s = 4.2e6 * math.exp(ratio / (ratio - 1.0))
          else
            Tnuc_s = 0
          end



          return {
            Tnuc_s = Tnuc_s,
            T_s = T_s,
            T_d = T_d
          }
        end



[mu_s, mu_d, d_c, cohesion, forced_rupture_time]: !ConstantMap
  map:
     mu_s:        0.6
     mu_d:        0.2
     d_c:         0.4
     cohesion:    0.0
     forced_rupture_time: 1e10
