!Switch
[T_n]: !ConstantMap
  map:
     T_n:        -20e6

[T_s, T_d]: !EvalModel
    parameters: [Omega, x, y, z, fault_tag]
    model: !Switch
        [Omega]: !Include omega.yaml
        [x, y, z]: !AffineMap
          matrix:
            x: [1.0, 0.0, 0.0]
            y: [0.0, 1.0, 0.0]
            z: [0.0, 0.0, 1.0]
          translation:
            x: 0.0
            y: 0.0
            z: 0.0
        [fault_tag]: !Any
             components:
             - !GroupFilter
                groups: 3
                # KefaloniaTransformFault
                components: !ConstantMap
                  map:
                    fault_tag: 3
             - !GroupFilter
                groups: 65
                # SouthernThrust
                components: !ConstantMap
                  map:
                    fault_tag: 65
             - !GroupFilter
                groups: 66
                # NorthernThurst
                components: !ConstantMap
                  map:
                    fault_tag: 66
    components: !LuaMap
      returns: [T_s, T_d]
      function: |
        function f (x)
          baseline_shear_stress = 8e6
          shear_stress = baseline_shear_stress * x.Omega

          if (x.fault_tag == 3) then
             T_s = shear_stress
             T_d = 0
          else
             T_d = shear_stress
             T_s = 0
          end

          return {
            T_s = T_s,
            T_d = T_d
          }
        end

